name: .NET API CI

on:
  push:
    branches: [ DockerBranch ]
  pull_request:
    branches: [ DockerBranch ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: |
          cd api
          dotnet restore

      - name: Run tests
        run: |
          cd api/Tests  # Your test project folder
          dotnet test
