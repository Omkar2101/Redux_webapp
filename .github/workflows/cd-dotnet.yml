name: Deploy .NET API to GHCR  # Workflow name

on:
  push:
    branches:
      - DockerBranch  # Run workflow when pushing to DockerBranch

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Run on Ubuntu machine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Fetch latest code

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build and tag Docker image
        run: |
          cd Backend  # Navigate to .NET API folder
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/redux-webapp-dotnet:latest .

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/redux-webapp-dotnet:latest
