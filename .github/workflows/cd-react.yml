name: Deploy React to GHCR

on:
  push:
    branches:
      - DockerBranch  # Runs when pushing to DockerBranch

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Use Ubuntu for the job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Pulls the latest code

      - name: Debug directory structure
        run: |
          pwd  # Print current working directory
          ls -la  # List all files and directories
          cd image_uploader || echo "Directory image_uploader does not exist"
          ls -la  # List files inside image_uploader

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and tag Docker image
        run: |
          docker buildx build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/redux-webapp-react:latest ./image_uploader

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/redux-webapp-react:latest